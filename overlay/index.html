<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Apex Performance Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!--
    A click-through panel that floats over a game. Everything it shows is a real
    measurement; see perf.js for where each number comes from and why there is no
    pretend in-game FPS readout.
  -->
  <div id="panel">
    <header class="ov-head">
      <span class="ov-dot"></span>
      <span class="ov-title">Performance</span>
      <span class="ov-key">F8</span>
    </header>

    <div class="ov-meters">
      <div class="ov-meter" data-meter="cpu">
        <span class="ov-label">CPU</span>
        <span class="ov-track"><i class="ov-fill"></i></span>
        <span class="ov-value" data-val="cpu">&mdash;</span>
      </div>
      <div class="ov-meter" data-meter="gpu">
        <span class="ov-label">GPU</span>
        <span class="ov-track"><i class="ov-fill"></i></span>
        <span class="ov-value" data-val="gpu">&mdash;</span>
      </div>
      <div class="ov-meter" data-meter="mem">
        <span class="ov-label">RAM</span>
        <span class="ov-track"><i class="ov-fill"></i></span>
        <span class="ov-value" data-val="mem">&mdash;</span>
      </div>
      <div class="ov-meter" data-meter="vram" hidden>
        <span class="ov-label">VRAM</span>
        <span class="ov-track"><i class="ov-fill"></i></span>
        <span class="ov-value" data-val="vram">&mdash;</span>
      </div>
    </div>

    <canvas id="spark" width="300" height="34" aria-hidden="true"></canvas>

    <div class="ov-game" id="game" hidden>
      <div class="ov-game-title" id="game-title">&mdash;</div>
      <div class="ov-game-stats">
        <span><b id="game-cpu">&mdash;</b><i>CPU</i></span>
        <span><b id="game-gpu">&mdash;</b><i>GPU</i></span>
        <span><b id="game-mem">&mdash;</b><i>RAM</i></span>
        <span><b id="game-up">&mdash;</b><i>UPTIME</i></span>
      </div>
    </div>

    <footer class="ov-foot">
      <span class="ov-present" title="Frames the desktop compositor presented, measured in this window. A game's own present rate needs a graphics hook (the way Steam, RTSS and the Game Bar get theirs), so it is not claimed here.">
        <b id="present-fps">&mdash;</b><i>present fps</i>
      </span>
      <span class="ov-present"><b id="present-ms">&mdash;</b><i>frame ms</i></span>
      <span class="ov-src" id="src"></span>
    </footer>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
