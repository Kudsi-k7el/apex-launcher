<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
  <title>Apex Launcher</title>
  <style>
    :root {
      --accent: #00a8ff;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; overflow: hidden; }

    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none; cursor: default;
    }

    .card {
      position: relative;
      width: 420px; height: 260px;
      border-radius: 18px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      background:
        radial-gradient(120% 130% at 50% -10%, rgba(0, 168, 255, .22), transparent 60%),
        linear-gradient(160deg, #14181f, #0a0c11);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .62), inset 0 1px 0 rgba(255, 255, 255, .05);
      overflow: hidden;
      animation: cardIn .55s var(--ease) both;
    }
    /* the glowing rim */
    .card::before {
      content: ""; position: absolute; inset: -1px; border-radius: 19px; padding: 1px;
      background: linear-gradient(140deg, rgba(0, 168, 255, .65), transparent 42%, transparent 58%, rgba(106, 61, 232, .6));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .mark {
      width: 74px; height: 74px; border-radius: 19px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(148deg, #1d1e23, #0a0a0d 62%);
      border: 1px solid rgba(255, 255, 255, .09);
      box-shadow: 0 0 26px rgba(255, 255, 255, .10), 0 10px 22px rgba(0, 0, 0, .45);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .mark img { width: 46px; height: auto; display: block; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 255, 255, .06), 0 10px 22px rgba(0, 0, 0, .45); }
      50%      { box-shadow: 0 0 32px rgba(255, 255, 255, .16), 0 10px 22px rgba(0, 0, 0, .45); }
    }

    h1 {
      margin-top: 16px;
      font-size: 19px; font-weight: 700; letter-spacing: .3px; color: #f2f5fa;
    }
    h1 span { color: var(--accent); }

    .status {
      margin-top: 6px;
      font-size: 12px; color: #8b95a7; letter-spacing: .2px;
      min-height: 16px;
      transition: opacity .25s;
    }

    .track {
      position: relative; margin-top: 22px;
      width: 268px; height: 4px; border-radius: 999px;
      background: rgba(255, 255, 255, .07); overflow: hidden;
    }
    .bar {
      position: absolute; inset: 0 auto 0 0;
      width: 40%; border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--accent), #6a3de8, transparent);
      animation: slide 1.35s var(--ease) infinite;
    }
    @keyframes slide {
      0%   { left: -45%; width: 38%; }
      50%  { width: 52%; }
      100% { left: 100%; width: 38%; }
    }

    .foot {
      position: absolute; bottom: 16px;
      font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
      color: #4c5566;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <img src="img/apex-mark.png" alt="">
    </div>
    <h1>Apex <span>Launcher</span></h1>
    <div class="status" id="status">Starting up&hellip;</div>
    <div class="track"><div class="bar"></div></div>
    <div class="foot">Your games, one place</div>
  </div>
  <script>
    // Small rotating status line so a slow disk does not look like a hang.
    var steps = ['Starting up\u2026', 'Reading your libraries\u2026', 'Checking for store installs\u2026', 'Almost there\u2026'];
    var i = 0;
    var el = document.getElementById('status');
    setInterval(function () {
      i = (i + 1) % steps.length;
      el.style.opacity = '0';
      setTimeout(function () { el.textContent = steps[i]; el.style.opacity = '1'; }, 220);
    }, 1700);
  </script>
</body>
</html>
